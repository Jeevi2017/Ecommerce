<div class="container mt-4">
  <div class="card shadow-sm rounded-3">
    
    <!-- HEADER -->
    <div class="card-header bg-dark text-white py-3">
      <h3 class="mb-0">Bulk Upload Products (CSV)</h3>
    </div>

    <div class="card-body p-4">

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="errorMessage = null">
        </button>
      </div>

      <!-- SUCCESS MESSAGE -->
      <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
        {{ successMessage }}
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="successMessage = null">
        </button>
      </div>

      <!-- FILE SELECT -->
      <div class="mb-4">
        <label for="csvFile" class="form-label fw-semibold">Select CSV File:</label>

        <!-- IMPORTANT: #fileInput added -->
        <input
          #fileInput
          type="file"
          id="csvFile"
          class="form-control"
          (change)="onFileSelected($event)"
          accept=".csv" />

        <div class="form-text mt-3 small text-muted">
          Upload a CSV file containing product data.

          <div class="mt-2">
            Required columns:
            <code>name, description, price, categoryId, stockQuantity, images</code>
          </div>

          <div class="mt-2">
            <strong>Available Categories:</strong><br>
            {{ categoryNames }}
          </div>

          <div class="mt-2">
            Images should be comma-separated URLs (optional).
          </div>
        </div>
      </div>

      <!-- UPLOAD BUTTON -->
      <button
        class="btn btn-primary w-100 py-2"
        (click)="onUpload()"
        [disabled]="!selectedFile || loading">

        <span
          *ngIf="loading"
          class="spinner-border spinner-border-sm me-2"
          role="status">
        </span>

        {{ loading ? 'Uploading...' : 'Upload CSV' }}
      </button>

      <!-- BACK BUTTON (FIXED ROUTER ISSUE) -->
      <div class="mt-4 text-center">
        <button
          type="button"
          class="btn btn-outline-secondary px-4"
          (click)="goBackToProducts()">

          ← Back to Product List
        </button>
      </div>

    </div>
  </div>
</div>
