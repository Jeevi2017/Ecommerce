<div *ngIf="isLoading" class="d-flex justify-content-center align-items-center vh-50 bg-light">
  <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div *ngIf="!isLoading && product" class="container py-5">

  <!-- Product Card -->
  <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
    <div class="row g-0">

      <!-- PRODUCT IMAGES -->
      <div class="col-md-6 bg-light p-4">
        <div class="position-relative mb-3" style="height: 500px;">
          <img
            [src]="product.images[currentImageIndex] || 'https://placehold.co/600x500'"
            class="img-fluid rounded-3"
            style="object-fit: contain; width: 100%; height: 100%;">
        </div>

        <div class="d-flex gap-2 justify-content-center">
          <img
            *ngFor="let img of product.images; let i = index"
            [src]="img"
            class="img-thumbnail"
            style="width: 80px; height: 80px; cursor: pointer;"
            [class.border-primary]="i === currentImageIndex"
            (click)="selectImage(i)">
        </div>
      </div>

      <!-- PRODUCT DETAILS -->
      <div class="col-md-6 p-4 p-lg-5">

        <h2 class="fw-bold">{{ product.name }}</h2>

        <div class="mb-3">
          <span class="fs-3 fw-bold text-success">
            ₹{{ product.price | number:'1.2-2' }}
          </span>
        </div>

        <p class="text-muted">{{ product.description }}</p>

        <!-- ================= SIZE SELECTION ================= -->
        <div class="mb-4">
          <label class="fw-bold mb-2 d-block">Select Size</label>

          <div class="d-flex flex-wrap gap-2">
            <button
              *ngFor="let size of product.availableSizes"
              type="button"
              class="btn btn-outline-dark px-4 py-2"
              [class.btn-dark]="selectedSize === size"
              [class.text-white]="selectedSize === size"
              (click)="selectSize(size)">
              {{ size }}
            </button>
          </div>

          <div *ngIf="!selectedSize" class="text-danger small mt-2">
            Please select a size
          </div>
        </div>

        <!-- ================= QUANTITY ================= -->
        <div class="mb-4 d-flex align-items-center">
          <label class="fw-bold me-3">Quantity</label>
          <input
            type="number"
            class="form-control text-center"
            style="width: 100px;"
            [(ngModel)]="quantity"
            (input)="onQuantityChange($event)"
            min="1"
            [max]="product.stockQuantity">
        </div>

        <!-- ================= ACTIONS ================= -->
        <div class="d-flex gap-3">

          <button
            class="btn btn-primary btn-lg flex-grow-1"
            [disabled]="product.stockQuantity === 0"
            (click)="addToCart()">
            <i class="bi bi-cart-plus me-2"></i>
            Add to Cart
          </button>

          <button
            class="btn btn-outline-danger btn-lg"
            style="width: 60px;"
            (click)="addToWishlist(product.id)">
            <i class="bi bi-heart"></i>
          </button>

        </div>

      </div>
    </div>
  </div>

  <!-- REVIEWS -->
  <app-product-review
    *ngIf="product.id"
    class="mt-5"
    [productId]="product.id">
  </app-product-review>

</div>
